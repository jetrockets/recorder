name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4']
        rails: ['6.1', '7.0', '7.1', '7.2', '8.0', '8.1']
        exclude:
          # Rails < 7.1 requires mutex_m, dropped from the default gems in 3.4.
          - {ruby: '3.4', rails: '6.1'}
          - {ruby: '3.4', rails: '7.0'}
          # Each Rails version's own minimum Ruby.
          - {ruby: '3.0', rails: '7.2'}
          - {ruby: '3.0', rails: '8.0'}
          - {ruby: '3.1', rails: '8.0'}
          - {ruby: '3.0', rails: '8.1'}
          - {ruby: '3.1', rails: '8.1'}
        include:
          # lib/ has no Ruby- or Rails-specific branches, so one cell's
          # coverage stands for the whole matrix.
          - {ruby: '3.4', rails: '8.1', coverage: true}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recorder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec

      - name: Write the coverage summary
        if: matrix.coverage
        run: |
          ruby -rjson -e '
            result = JSON.parse(File.read("coverage/.last_run.json"))["result"]
            puts "### Coverage", "", "| Lines | Branches |", "| --- | --- |",
                 "| #{result["line"]}% | #{result["branch"]}% |"
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: matrix.coverage
        with:
          name: coverage
          path: coverage/
          include-hidden-files: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: bundle exec rubocop
