# frozen_string_literal: true

# Database used by the dummy app that the specs run against.
#
# This file is committed on purpose: without it a fresh clone has nothing to
# connect with and the whole suite fails to boot. Every value can be overridden
# from the environment, so local setups and CI can point at their own Postgres
# without editing (or accidentally committing changes to) this file. Setting
# DATABASE_URL also works -- Rails merges it over whatever is configured here.

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('RECORDER_DB_HOST', 'localhost') %>
  port: <%= ENV.fetch('RECORDER_DB_PORT', 5432) %>
  username: <%= ENV.fetch('RECORDER_DB_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('RECORDER_DB_PASSWORD', 'postgres') %>
  pool: 5

test:
  <<: *default
  database: <%= ENV.fetch('RECORDER_DB_NAME', 'recorder_test') %>
